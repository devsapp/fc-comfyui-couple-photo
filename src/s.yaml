edition: 3.0.0 #  命令行YAML规范版本，遵循语义化版本（Semantic Versioning）规范
name: fc-stable-diffusion
access: '{{ access }}'
vars:
  region: '{{ region }}'
  prefix: '{{ namespace }}'
  endpoint: '{{ endpoint }}'

resources:
  web:
    component: fc3
    actions:
      pre-deploy: # 项目deploy执行之前执行
        - run: |
            cat > data.json << EOF
            {{ config }}
            EOF
          path: ./web/dist # 命令行运行的路径
    props:
      region: '${vars.region}'
      functionName: '${vars.prefix}__web'
      description: 'ComfyUI 工具箱'
      timeout: 300
      diskSize: 512
      runtime: custom
      cpu: 1
      memorySize: 1024
      instanceConcurrency: 100
      code: web/dist
      customRuntimeConfig:
        port: 9000
        command:
          - node
        args:
          - index.js

  custom-domain:
    component: fc3-domain
    props: #  组件的属性值
      region: ${vars.region}
      domainName: auto
      protocol: HTTP
      routeConfig:
        routes:
          - functionName: ${resources.web.props.functionName}
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            path: /*
            qualifier: LATEST
